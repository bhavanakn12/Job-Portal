<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jobs | CareerConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            CareerConnect
        </a>

        <div>

            <a href="/jobs"
               class="btn btn-outline-primary me-2">
                Jobs
            </a>

            <a href="/login"
               class="btn btn-primary">
                Login
            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Find Your Dream Job
        </h1>

        <p class="text-muted">
            Explore opportunities and find the right career for you.
        </p>

    </div>


    <!-- Search -->

    <div class="search-box mb-5">

        <div class="row g-3">

            <div class="col-md-5">

                <input
                    type="text"
                    id="titleSearch"
                    class="form-control"
                    placeholder="Search by job title">

            </div>

            <div class="col-md-5">

                <input
                    type="text"
                    id="locationSearch"
                    class="form-control"
                    placeholder="Search by location">

            </div>

            <div class="col-md-2">

                <button
                    class="btn btn-primary w-100"
                    onclick="searchJobs()">
                    Search
                </button>

            </div>

        </div>

    </div>


    <div id="message"
         class="alert d-none">
    </div>


    <div id="jobsList">

        <div class="text-center py-5">

            <div class="spinner-border text-primary"
                 role="status">
            </div>

            <p class="mt-3 text-muted">
                Loading jobs...
            </p>

        </div>

    </div>

</div>


<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 CareerConnect. All rights reserved.
        </p>

    </div>

</footer>


<script th:src="@{/js/jobs.js}"></script>

</body>

</html>
